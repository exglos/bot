<!DOCTYPE html>
<html lang="en">
<head>
    <title>ethereum address verification</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.0.0/dist/ethers.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>verify ethereum address</h1>
    </header>
    <section>
        <p>message</p>
        <input type="text" id="inputMessage" placeholder="enter message" />
        <p>signature</p>
        <input type="text" id="inputSignature" placeholder="enter signature" />
        <p>sign and verify</p>
        <button id="sign">connect wallet & sign message</button>
        <button id="verify">verify</button>
        <p id="error" style="color:red;"></p>
        <p>signer's address: <span id="address"></span></p>
        <p>signature: <span id="signature"></span></p>
    </section>
    <script>
        const params = new URLSearchParams(window.location.search);
        let message = params.get("message") || Math.random().toString(36).substring(2);
        document.getElementById('inputMessage').value = message;
        document.getElementById('inputSignature').value = params.get('signature') || ''

        document.getElementById('sign').onclick = async function () {
            const message = document.getElementById('inputMessage').value;
            if (typeof window.ethereum === 'undefined') {
                document.getElementById('error').innerText = 'web3 not found';
                return;
            }
            await window.ethereum.request({ method: 'eth_requestAccounts' });
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            try {
                document.getElementById('error').innerText = '';
                const address = await signer.getAddress();
                document.getElementById('address').innerText = address;
                const signature = await signer.signMessage(message);
                document.getElementById('inputSignature').value = signature;
                document.getElementById('signature').innerText = signature;
            } catch (error) {
                document.getElementById('error').innerText = 'error: ' + error.message;
                document.getElementById('address').innerText = '';
                document.getElementById('signature').innerText = '';
            }
        };

        document.getElementById('verify').onclick = async function () {
            const message = document.getElementById('inputMessage').value;
            const signature = document.getElementById('inputSignature').value;
            try {
                document.getElementById('error').innerText = '';
                const address = ethers.utils.verifyMessage(message, signature);
                document.getElementById('address').innerText = address;
            } catch (error) {
                document.getElementById('error').innerText = 'error: ' + error.message;
                document.getElementById('address').innerText = '';
                document.getElementById('signature').innerText = '';
            }
        }
    </script>
</body>
</html>
